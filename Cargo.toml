[workspace]
members = ["kloyce", "kloyce-ctl", "kloyce-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/andrew-pynch/kloyce"
homepage = "https://github.com/andrew-pynch/kloyce"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
