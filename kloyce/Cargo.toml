[package]
name = "kloyce"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Push-to-talk speech-to-text daemon for Wayland (Hyprland)"
readme = "../README.md"
keywords = ["speech-to-text", "wayland", "whisper", "voice", "transcription"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[package.metadata.deb]
name = "kloyce"
maintainer = "Andrew Pynch <andrew@pynch.dev>"
depends = "pipewire, wl-clipboard, wtype, libnotify-bin, ffmpeg"
section = "utils"
priority = "optional"
assets = [
    ["target/release/kloyce", "usr/bin/", "755"],
    ["target/release/kloyce-ctl", "usr/bin/", "755"],
    ["../install/kloyce.deb.service", "usr/lib/systemd/user/kloyce.service", "644"],
]
